<div class="container mt-5 text-white">
  <h2 class="text-info fw-bold mb-4">
    <mat-icon class="align-middle me-2">admin_panel_settings</mat-icon>
    Admin Dashboard
  </h2>

  <mat-card class="bg-dark text-white border border-secondary shadow">
    <mat-card-header class="border-bottom border-secondary pb-3 mb-3">
      <mat-card-title class="text-light">Episodes with Blocked Comments</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      @if (lockedEpisodes().length > 0) {
        <table mat-table [dataSource]="lockedEpisodes()" class="w-100 bg-transparent text-white">
          <ng-container matColumnDef="episodeId">
            <th mat-header-cell *matHeaderCellDef class="text-info fw-bold">Episode ID</th>
            <td mat-cell *matCellDef="let element" class="text-light">
              Episode #{{ element.episodeId }}
            </td>
          </ng-container>

          <ng-container matColumnDef="createdAt">
            <th mat-header-cell *matHeaderCellDef class="text-info fw-bold">Blocking Date</th>
            <td mat-cell *matCellDef="let element" class="text-secondary">
              {{ element.createdAt | date: 'shortDate' }}
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="text-end text-info fw-bold">Actions</th>
            <td mat-cell *matCellDef="let element" class="text-end">
              <button mat-flat-button color="warn" (click)="unlockEpisode(element.episodeId)">
                <mat-icon>lock_open</mat-icon>
                Unlock
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr
            mat-row
            *matRowDef="let row; columns: displayedColumns"
            class="border-bottom border-secondary"
          ></tr>
        </table>
      } @else {
        <div class="text-center py-5 text-secondary">
          <mat-icon style="font-size: 3rem; width: 3rem; height: 3rem"
            >check_circle_outline</mat-icon
          >
          <p class="mt-3 fs-5">There are no episodes currently blocked.</p>
        </div>
      }
    </mat-card-content>
  </mat-card>
</div>
