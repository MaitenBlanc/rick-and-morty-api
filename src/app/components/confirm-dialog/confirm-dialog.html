<h2 mat-dialog-title>Delete Comment</h2>
    <mat-dialog-content>
      <p>{{ data.message }}</p>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-button (click)="onDismiss()">Cancelar</button>
      <button mat-flat-button color="warn" (click)="onConfirm()">Aceptar</button>
    </mat-dialog-actions>
